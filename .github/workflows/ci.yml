name: relay-integrity

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dependency-free cryptographic smoke
        run: npm run smoke

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck protocol and applications
        run: npm run typecheck

      - name: Adversarial protocol policy and lifecycle tests
        run: npm test

      - name: Production builds
        run: npm run build
